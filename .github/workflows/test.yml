name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --check claude-image-gen.js
      - run: node scripts/bump.js --check
      - run: node claude-image-gen.js --version
      # Unit, MCP and browser tests. The runners come with Chrome, which the browser tests drive headless.
      - run: node --test
      - run: npm pack --dry-run
